<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
/* TRADEX Arazi & Gayrimenkul */
.land-hero{overflow:hidden;background:linear-gradient(125deg,#101d3c,#182d52 58%,#263e61);color:#f5f7ff;border:1px solid #34496e}
.land-hero-art{display:flex;align-items:center;gap:18px;padding:8px 4px 18px}.land-hero-art>svg{width:76px;height:76px;flex:none;filter:drop-shadow(0 5px 12px #0006)}.land-hero-art h2{font-size:clamp(22px,4vw,34px);margin:8px 0 4px}.land-hero-art p{color:#c4d0e5;margin:0;line-height:1.5}.land-stats{border-top:1px solid #ffffff25;padding-top:14px}.land-stats>div{display:flex;flex-direction:column;gap:3px}.land-stats b{font-size:18px;color:#f4c96e}.land-stats small{font-size:11px;color:#c4d0e5}
.land-tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.land-tabs button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 13px;white-space:nowrap;font-weight:800}.land-tabs button.on{background:#20385f;border-color:#d8a83d;color:#f5cf79}.land-tabs svg{width:18px;height:18px;vertical-align:middle;margin-right:5px}
.land-card{overflow:hidden;padding:0!important}.land-card>.hd,.land-card>.row{padding:12px}.land-art{height:120px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:13px;color:white;position:relative;overflow:hidden;background:linear-gradient(145deg,#2b704e,#9abf72)}.land-art:before,.land-art:after{content:"";position:absolute;border:1px solid #ffffff65;transform:rotate(-25deg);width:180px;height:90px;right:-25px;top:-22px;background:#ffffff12}.land-art:after{right:40px;top:55px;width:120px;height:55px}.land-art b,.land-art small,.land-stamp{position:relative;z-index:1;text-shadow:0 2px 6px #0008}.land-art b{font-size:17px}.land-art small{font-size:11px}.land-stamp{position:absolute;right:13px;top:12px;width:44px;height:44px;padding:8px;border-radius:12px;background:#07152a88}.land-stamp svg{width:100%;height:100%}.land-konut{background:linear-gradient(145deg,#315a8c,#80a9c9)}.land-ticari{background:linear-gradient(145deg,#56437f,#b28ac8)}.land-sanayi{background:linear-gradient(145deg,#46505d,#8e9ba7)}.land-tarim{background:linear-gradient(145deg,#286344,#9cbf57)}.land-turizm{background:linear-gradient(145deg,#17627a,#55c3c5)}
.land-list{display:flex;flex-direction:column;gap:9px}.land-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.land-mini{width:42px;height:42px;display:grid;place-items:center;border-radius:11px;background:#dba83b20}.land-mini svg{width:26px;height:26px}.land-row .t{min-width:0}.land-row .t b,.land-row .t span,.land-row .t small{display:block}.land-row .t span,.land-row .t small{font-size:11px;color:var(--dim);margin-top:3px}.land-row .v{text-align:right;white-space:nowrap}.land-row .v small{display:block;font-size:10px;color:var(--dim)}.land-actions{grid-column:2/-1;display:flex;gap:7px;justify-content:flex-end}.land-row .btn{white-space:nowrap}.land-row .btn svg{width:15px;height:15px}@media(max-width:520px){.land-row{grid-template-columns:38px minmax(0,1fr) auto;gap:7px;padding:9px}.land-mini{width:36px;height:36px}.land-row .v b{font-size:12px}.land-row .btn{font-size:11px;padding:7px 9px}.land-actions{grid-column:1/-1}.land-hero-art>svg{width:56px;height:56px}}

/* v6: temalar */
html[data-theme=siyah]{--bg:#000;--bg2:#050505;--panel:#0B0B0D;--panel2:#141417;--line:#26262B;--line2:#33333A}
html[data-theme=siyah] body{background:#000}html[data-theme=siyah] body::before,html[data-theme=siyah] .side{background:#000}
html[data-theme=beyaz]{--bg:#F2F4F9;--bg2:#fff;--panel:#fff;--panel2:#EDF1F8;--line:#D3DAE8;--line2:#BFC9DE;--ink:#121A30;--muted:#55627F;--dim:#7B879F;--gold:#B87A0A;--gold2:#9A6508;--green:#12834A;--red:#D8352A;color-scheme:light}
html[data-theme=beyaz] body{background:#F2F4F9}html[data-theme=beyaz] body::before,html[data-theme=beyaz] .side{background:#fff}
html[data-theme=beyaz] .side button,html[data-theme=beyaz] .side button[aria-current=true]{color:#121A30}
/* v6: bölüm kapakları */
.sechero{position:relative;border-radius:16px;overflow:hidden;margin:0 0 12px;height:130px;border:1px solid var(--line)}
.sechero svg{position:absolute;inset:0;width:100%;height:100%}
.sechero .ht{position:absolute;inset:auto 0 0 0;padding:26px 14px 10px;background:linear-gradient(0deg,rgba(7,14,31,.85),transparent);color:#fff}
.sechero .ht b{display:block;font:700 26px var(--fc);letter-spacing:.02em}.sechero .ht span{font-size:13px;opacity:.9}
.sechero .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
.sechero .smoke{animation:rise 3s ease-out infinite}.sechero .sun{animation:pulse 4s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(5deg)}}@keyframes rise{0%{transform:translateY(0);opacity:.6}100%{transform:translateY(-26px);opacity:0}}@keyframes pulse{50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){.sechero *{animation:none!important}}
/* v6: gazete */
.gz{background:#F6F0E0;color:#1C2233;border:1px solid #D8CCAE;border-radius:14px;padding:14px;min-height:72vh;margin-top:10px}
.gz .mh{text-align:center;border-bottom:4px double #1C2233;padding-bottom:8px}
.gz .mh b{display:block;font:700 clamp(28px,8vw,46px) var(--fq);letter-spacing:.02em}
.gz .mh small{display:flex;justify-content:space-between;font-size:11px;color:#6E6550;text-transform:uppercase;letter-spacing:.08em;border-top:1px solid #1C2233;margin-top:6px;padding-top:4px}
.gz img{width:100%;object-fit:cover;border-radius:6px;display:block;filter:sepia(.2)}
.gz .lead img{max-height:280px}.gz .lead h2{font:700 clamp(24px,6vw,34px)/1.15 var(--fq);margin:8px 0 4px;color:#1C2233}
.gz p{margin:4px 0;font:400 15px/1.55 Georgia,serif}.gz small{color:#6E6550;font-size:11.5px}
.gz .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:12px;border-top:1px solid #1C2233;padding-top:12px}
.gz .cols article{border-bottom:1px solid #D8CCAE;padding-bottom:10px}.gz .cols img{height:130px}
.gz h3{font:700 19px/1.2 var(--fq);color:#1C2233;margin:6px 0 2px}.gz .empty{text-align:center;padding:40px 0;color:#6E6550}
.paper{min-height:60vh}.paper .mast span{font-family:var(--fq);font-size:36px}
/* v7: ana menü */
.hhead{margin:0 0 10px}.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.hs{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.hs small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}.hs b{font:700 clamp(16px,4.6vw,22px) var(--fc);white-space:nowrap}
.htiles{display:flex;flex-direction:column;gap:12px}.tg .lbl{display:block;margin-bottom:6px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:1px solid var(--line);background:var(--panel2);border-radius:14px;font-size:13px;font-weight:700;color:var(--ink);transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--goldline)}.tile:active{transform:scale(.96)}.tile i{width:34px;height:34px;display:block}.tile i svg{width:100%;height:100%}
.det>summary{cursor:pointer;padding:10px 4px;list-style:none}.det[open]>summary{margin-bottom:6px}

 
/* SVG icon rhythm and section-specific polish */
.tile i svg,.card-h h3 svg{filter:drop-shadow(0 2px 5px rgba(0,0,0,.22))}
.htiles .tg{padding:10px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,rgba(24,43,82,.55),rgba(9,19,40,.35))}
.htiles .tg .lbl{padding-left:3px}
.tile{min-height:88px;justify-content:center;background:linear-gradient(155deg,#172a52,#101d3b)}
.tile b{text-align:center;line-height:1.1}
\n/* TRADEX v8 polish */
.depot-hero{background:radial-gradient(circle at 92% 8%,rgba(233,180,76,.2),transparent 34%),linear-gradient(135deg,#172d56,#0e1b38)}
.depot-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.depot-metrics>div{padding:11px;border:1px solid #ffffff1c;border-radius:12px;background:#07142c80;min-width:0}
.depot-metrics small{display:block;color:var(--muted);font-size:11px}
.depot-metrics b{display:block;margin-top:4px;color:var(--gold);font-size:clamp(13px,3.5vw,18px);overflow-wrap:anywhere}
.depot-cap{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:11px;border-radius:12px;background:linear-gradient(90deg,#172d56,#101f40);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.depot-cap b{color:var(--ink)}
.depot-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 12px;color:var(--muted)}
.depot-empty span{font-size:38px}.depot-empty b{color:var(--ink);font-size:16px}.depot-empty small{font-size:12px}
.travel-split{display:grid!important;grid-template-columns:1fr 1fr;gap:8px!important}
.travel-mode{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,#14264b,#0b1731);min-width:0}
.travel-mode.air{border-color:#d8a83d66;background:linear-gradient(145deg,#352d50,#111c39)}
.travel-mode small{font-size:10px;letter-spacing:.04em;color:var(--muted)}
.travel-mode b{font-size:12px}
.travel-mode .btn{width:100%;font-size:11px;padding:8px 5px}
.report-total{padding:16px;border-radius:14px;background:#07142c80;border:1px solid var(--line)}
.report-total b{display:block;font:800 clamp(26px,7vw,38px) var(--fc)}
.report-total small,.report-kpis small{display:block;color:var(--muted);font-size:11px}
.report-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.report-kpis>div{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.report-kpis b{display:block;font-size:clamp(14px,3.7vw,19px);overflow-wrap:anywhere}
.report-compare{display:flex;flex-direction:column;gap:7px}
@media(max-width:390px){.depot-metrics{grid-template-columns:1fr 1fr}.depot-metrics>div:first-child{grid-column:1/-1}.travel-split{grid-template-columns:1fr}}
/* v9: Toptancı ve yönetim */
.wshero{position:relative;border-radius:16px;overflow:hidden;margin:0 0 12px;height:130px;border:1px solid var(--line)}
.wshero svg{position:absolute;inset:0;width:100%;height:100%}
.wshero .wsh-t{position:absolute;inset:auto 0 0 0;padding:26px 14px 10px;background:linear-gradient(0deg,rgba(7,14,31,.88),transparent);color:#fff}
.wshero .wsh-t>b{display:block;font:700 26px var(--fc);letter-spacing:.02em}.wshero .wsh-t span{font-size:12.5px;opacity:.92}
.ws-truck{animation:wsDrive 8s linear infinite}
@keyframes wsDrive{0%{transform:translateX(-70px)}100%{transform:translateX(470px)}}
.ws-crate{animation:wsBob 2.4s ease-in-out infinite;transform-box:fill-box}
@keyframes wsBob{50%{transform:translateY(-3px)}}
.ws-sun{animation:pulse 4s ease-in-out infinite}
.chrep{background:none;border:0;color:var(--dim);font-size:12px;padding:2px 6px;opacity:.5;cursor:pointer}.chr:hover .chrep{opacity:1}
@media (prefers-reduced-motion:reduce){.ws-truck,.ws-crate,.ws-sun{animation:none!important}}

<title>TRADEX</title>

<style>
/* Düzen: lacivert-altın oyun paneli. Telefonda tek kolon + alt menü; geniş ekranda sol menü + kart ızgarası. Tek, koyu tema. */
:root{
  --bg:#070E1F; --bg2:#0B1530; --panel:#0F1C3A; --panel2:#13234A; --line:#22345F; --line2:#2C4378;
  --ink:#EEF2FA; --muted:#93A2C4; --dim:#64739A;
  --gold:#E9B44C; --gold2:#C98A1C; --gold-soft:rgba(233,180,76,.14); --goldline:rgba(233,180,76,.45);
  --green:#3DD07E; --green-bg:#16733F; --red:#FF6B5E; --red-bg:#A8302A; --blue:#3B82F6; --blue-bg:#1D4FB8; --purple:#7C4DDB; --teal:#14A39A;
  --c-ist:#5AA2FF; --c-ank:#FF8A63; --c-izm:#37D3A8; --c-bur:#B58CFF; --c-ant:#FFC94A;
  --f:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fc:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --fq:"Playfair Display",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.4;font-weight:600;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(1200px 600px at 70% -10%,#16295A 0%,transparent 60%),var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.up{color:var(--green)} .down{color:var(--red)} .gold{color:var(--gold)}
h1,h2,h3{margin:0;font-family:var(--fc);text-wrap:balance;letter-spacing:.01em}
h2{font-size:22px;font-weight:700} h3{font-size:19px;font-weight:700}
.gutter{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13.5px;color:var(--muted);font-weight:500;margin:0}

/* Kabuk */
.shell{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.main{min-width:0;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
@media (min-width:1080px){
  .shell{grid-template-columns:230px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#0A1430,#060C1C);border-right:1px solid var(--line);padding:16px 10px}
  .main{padding-bottom:60px}
  .bnav{display:none!important}
  .statusbar{display:flex!important}
}
.side .logo{padding:6px 8px 16px}
.side button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--ink);padding:11px 12px;border-radius:10px;font-weight:700;font-size:15.5px;text-align:left}
.side button svg{width:26px;height:26px;flex:none}
.side button[aria-current="true"]{background:linear-gradient(90deg,rgba(233,180,76,.32),rgba(233,180,76,.06));box-shadow:inset 3px 0 0 var(--gold);color:#fff}
.side button:hover{background:rgba(255,255,255,.05)}
.side .motto{margin-top:auto;border:1px solid var(--goldline);border-radius:12px;padding:14px;text-align:center;background:radial-gradient(circle at 50% 0,rgba(233,180,76,.18),transparent 70%)}
.side .motto b{font-family:var(--fc);font-size:22px;color:var(--gold);display:block}
.side .motto i{font-family:var(--fq);font-size:14px;color:#D9C9A3}

/* Üst çubuk */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;background:linear-gradient(180deg,#0B1636,#081128);border-bottom:1px solid var(--line)}
.who{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 220px}
.ava{width:52px;height:52px;border-radius:50%;flex:none;border:2px solid var(--gold);background:radial-gradient(circle at 50% 35%,#4B5A80 0 30%,transparent 31%),radial-gradient(ellipse at 50% 100%,#4B5A80 0 45%,transparent 46%),#1A2747;display:grid;place-items:center;font-family:var(--fc);font-size:22px;font-weight:800;color:#fff;box-shadow:0 0 0 3px rgba(233,180,76,.15)}
.who .nm{font-family:var(--fc);font-size:20px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .lv{font-size:13px;color:var(--muted)}
.xp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.xp .b{height:7px;width:130px;max-width:40vw;background:#1C2A4E;border-radius:5px;overflow:hidden}
.xp .b i{display:block;height:100%;background:linear-gradient(90deg,#F7D27A,var(--gold2));border-radius:5px}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:8px;padding:6px 12px;border-left:1px solid var(--line)}
.stat svg{width:30px;height:30px;flex:none}
.stat b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat small{font-size:12px;font-weight:700}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);background:#14244A;display:grid;place-items:center;position:relative;flex:none}
.iconbtn svg{width:22px;height:22px}
.iconbtn .badge{top:-4px;right:-4px}

/* Ana içerik */
.content{display:flex;flex-direction:column;gap:14px;padding-block:14px;max-width:1240px;margin:0 auto}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.card.gold{border-color:var(--goldline)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-h h3{display:flex;align-items:center;gap:8px}
.card-h h3 svg{width:24px;height:24px}
.pill-link{border:1px solid var(--line2);background:#14244A;border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
@media (min-width:1080px){ .home-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px} .home-grid > *{min-width:0} }

/* Kahraman bandı */
.hero{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);min-height:180px}
.hero svg.sky{position:absolute;inset:0;width:100%;height:100%}
.hero .hin{position:relative;padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px;min-height:190px;justify-content:space-between}
.hero .brand{display:flex;align-items:center;gap:10px}
.hero .brand svg{width:56px;height:46px}
.logo-t{font-family:var(--fc);font-style:italic;font-weight:800;font-size:44px;line-height:.9;letter-spacing:.02em;background:linear-gradient(180deg,#FFFFFF 0%,#C9D3E6 45%,#7D8BA8 55%,#E8EDF7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.logo-s{font-size:12px;letter-spacing:.24em;color:#E3E8F2;font-weight:700}
.hero .clock{display:flex;gap:10px;flex-wrap:wrap}
.glass{background:rgba(7,14,31,.62);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:10px}
.glass svg{width:28px;height:28px;flex:none}
.glass b{display:block;font-size:16px}
.glass small{font-size:13px;color:#C9D3E6}
.hero .quote{font-family:var(--fq);font-style:italic;font-size:clamp(20px,3.4vw,30px);text-shadow:0 2px 8px rgba(0,0,0,.7);text-align:center}
.hero .quote small{display:block;font-size:clamp(13px,1.8vw,16px);color:#E8E1CC}

/* Ana butonlar */
.mainbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mb{border:1px solid var(--line2);background:linear-gradient(180deg,#172A57,#0F1D3E);border-radius:14px;padding:12px 10px;display:flex;align-items:center;gap:10px;text-align:left;min-width:0;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.mb svg{width:44px;height:44px;flex:none}
.mb b{display:block;font-family:var(--fc);font-size:19px;font-weight:700;line-height:1.05}
.mb small{display:block;font-size:12.5px;color:var(--muted);line-height:1.2}
.mb .chev{margin-left:auto;color:var(--muted);font-size:20px}
.mb:hover{border-color:var(--goldline)}
@media (max-width:560px){ .mainbtns{gap:8px} .mb{flex-direction:column;align-items:flex-start;padding:10px} .mb .chev{display:none} .mb svg{width:38px;height:38px} .mb b{font-size:17px} .mb small{font-size:11.5px} }

/* Harita */
.mapwrap{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.mapwrap svg{display:block;width:100%;height:auto}
.mapwrap .city{cursor:pointer}

/* Listeler, satırlar */
.rows{display:flex;flex-direction:column}
.r{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.r:last-child{border-bottom:0}
.r .t{flex:1;min-width:0}
.r .t b{display:block;font-weight:700}
.r .t span{font-size:13px;color:var(--muted);font-weight:500}
.r .v{text-align:right;flex:none}
.r .v b{display:block;font-weight:800;font-variant-numeric:tabular-nums}
.r .v span{font-size:12.5px;font-weight:700}
.emo{width:42px;height:42px;border-radius:12px;background:#1A2B55;display:grid;place-items:center;font-size:22px;flex:none;line-height:1}
.rowbtn{width:100%;border:0;background:transparent;text-align:left;cursor:pointer;color:inherit}
.rowbtn.sel{background:rgba(233,180,76,.08);margin:0 -14px;padding-left:14px;padding-right:14px;width:calc(100% + 28px)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:14px}
.kv dt{color:var(--muted);font-weight:500} .kv dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* Butonlar */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;font-size:15px;background:#1E3264;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 0 #0A1430;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0A1430}
.btn.gold{background:linear-gradient(180deg,#F2C46A,#C98A1C);color:#2B1A00}
.btn.green{background:linear-gradient(180deg,#2FB466,#16733F)}
.btn.red{background:linear-gradient(180deg,#E2584D,#A8302A)}
.btn.blue{background:linear-gradient(180deg,#3B82F6,#1D4FB8)}
.btn.purple{background:linear-gradient(180deg,#8E62EA,#5B33B5)}
.btn.teal{background:linear-gradient(180deg,#1BB7AD,#0E7A73)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn small{display:block;font-size:12px;font-weight:700;opacity:.9}
.btn.col{flex-direction:column;gap:0}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa .btn{justify-content:flex-start;padding:12px 14px}
.qa .btn svg{width:26px;height:26px}
.go{border:1px solid var(--goldline);background:var(--gold-soft);color:var(--gold);font-weight:800;font-size:13.5px;border-radius:10px;padding:7px 11px;white-space:nowrap;flex:none}
.go.red{border-color:rgba(255,107,94,.5);background:rgba(255,107,94,.12);color:var(--red)}
.go.green{border-color:rgba(61,208,126,.5);background:rgba(61,208,126,.12);color:var(--green)}
:focus-visible{outline:3px solid #7FA7F5;outline-offset:2px}
.in{border:1.5px solid var(--line2);background:#0A1530;border-radius:10px;padding:9px 11px;min-width:0;font-weight:700;color:var(--ink)}
.in:focus{outline:none;border-color:var(--gold)}
textarea.in{resize:vertical;min-height:90px;font-weight:500;line-height:1.45}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pb{border:1px solid var(--line2);background:#14244A;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.pb i{width:9px;height:9px;border-radius:50%;display:inline-block}
.pb[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#2B1A00}
.scrollx{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.scrollx::-webkit-scrollbar{display:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#0A1530;border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 6px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#F2C46A,#C98A1C);color:#2B1A00}
.tag{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:#1C2D57;color:var(--muted)}
.tag.green{background:rgba(61,208,126,.15);color:var(--green)} .tag.red{background:rgba(255,107,94,.15);color:var(--red)} .tag.gold{background:var(--gold-soft);color:var(--gold)}
.badge{position:absolute;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 6px;box-shadow:0 0 0 2px var(--bg)}
.flash{border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700}
.flash.ok{background:rgba(61,208,126,.14);color:#A8F0C6;border:1px solid rgba(61,208,126,.35)}
.flash.no{background:rgba(255,107,94,.14);color:#FFC2BC;border:1px solid rgba(255,107,94,.35)}
.banner{background:var(--gold-soft);border:1px solid var(--goldline);color:#F7DFA9;border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar{height:9px;background:#1A2A50;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#5B8EF0,#3B82F6);border-radius:6px}
.bar.full i{background:linear-gradient(90deg,#FF8A63,var(--red))}
.bar.gold i{background:linear-gradient(90deg,#F7D27A,var(--gold2))}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.slot{border:1px solid var(--line);background:#0C1834;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.slot .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.slot .hd .ti{display:flex;align-items:center;gap:10px;min-width:0}
.slot .hd .ti b{display:block}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);background:#14244A;font-size:20px;font-weight:900}
.stepper input{width:100px;text-align:center}
.limits{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.limits b{color:var(--ink)}
.rng{position:relative;height:10px;border-radius:6px;background:linear-gradient(90deg,#3DD07E,#F2C14E,#FF8A63)}
.rng i{position:absolute;top:-4px;width:6px;height:18px;border-radius:3px;background:#fff;transform:translateX(-50%);box-shadow:0 0 0 2px var(--bg)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.t .r{text-align:right;display:table-cell;border:0;border-bottom:1px solid var(--line)}
.tw{overflow-x:auto;margin:0 -14px;padding:0 14px}
.chartbox canvas{width:100%;height:190px;display:block}
.mini canvas{width:100%;height:110px;display:block}
.news li{list-style:none;padding:10px 0 10px 12px;border-bottom:1px solid var(--line);border-left:3px solid var(--line);font-size:14px;font-weight:500}
.news li.good{border-left-color:var(--green)} .news li.bad{border-left-color:var(--red)}
.news li.admin{border-left-color:var(--gold);background:var(--gold-soft);border-radius:0 12px 12px 0;margin-bottom:6px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding-right:10px}
.news li.admin b{font-weight:800}
.news li.admin p{margin:0;white-space:pre-wrap}
.news ul{padding:0;margin:0}
.news small{display:block;color:var(--muted);font-size:11.5px;font-weight:700}
.newsrow{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.newsrow:last-child{border-bottom:0}
.newsrow .th{width:84px;height:60px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,#1C2E5C,#0E1A38);border:1px solid var(--line)}
.newsrow b{display:block;font-family:var(--fc);font-size:17px;font-weight:700}
.newsrow p{margin:2px 0 0;font-size:13px;color:var(--muted);font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.newsrow small{color:var(--dim);font-size:12px}
.tut{border:2px solid var(--gold)!important;background:linear-gradient(180deg,#1E2B50,#121F40)!important}
.tutbar{height:6px;border-radius:4px;background:#1A2A50;overflow:hidden}
.tutbar i{display:block;height:100%;background:var(--gold)}
.tut-on{position:relative;z-index:1;animation:tutp 1.4s ease-in-out infinite;outline:3px solid var(--gold)!important;outline-offset:3px}
@keyframes tutp{0%,100%{outline-color:rgba(233,180,76,1)}50%{outline-color:rgba(233,180,76,.2)}}
.lockbox{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:10px 6px}
.lockbox .lv{font-family:var(--fc);font-size:40px;font-weight:800;color:var(--gold)}
.soon{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px 10px}
.soon .big{font-size:64px;line-height:1}
.soon b{font-family:var(--fc);font-size:30px;color:var(--gold)}

/* Kimlik kartı */
.idcard{position:relative;border-radius:18px;overflow:hidden;color:#16213A;aspect-ratio:1.586;max-width:560px;width:100%;margin:0 auto;
  background:
    repeating-radial-gradient(circle at 18% 120%,rgba(201,138,28,.10) 0 2px,transparent 2px 9px),
    repeating-linear-gradient(115deg,rgba(29,79,184,.06) 0 1px,transparent 1px 7px),
    linear-gradient(135deg,#F8F1DE 0%,#EAF0FA 55%,#F5E6C8 100%);
  box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.6)}
.idcard .top{display:flex;align-items:center;gap:10px;padding:4% 5% 2%;border-bottom:2px solid rgba(201,138,28,.6);background:linear-gradient(90deg,rgba(11,21,48,.95),rgba(19,35,74,.92));color:#fff}
.idcard .top svg{width:11%;height:auto;flex:none}
.idcard .top b{font-family:var(--fc);font-size:clamp(14px,3.6vw,21px);letter-spacing:.08em;display:block;line-height:1}
.idcard .top small{font-size:clamp(9px,2.1vw,12px);letter-spacing:.14em;color:var(--gold)}
.idcard .body{display:grid;grid-template-columns:30% 1fr;gap:4%;padding:4% 5%}
.idcard .photo{aspect-ratio:3/4;border-radius:8px;background:linear-gradient(180deg,#C9D3E6,#9AA8C4);display:grid;place-items:end center;overflow:hidden;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.idcard .photo svg{width:90%}
.idcard .f{display:grid;grid-template-columns:1fr 1fr;gap:3% 6%;align-content:start}
.idcard .f div{min-width:0}
.idcard .f .w{grid-column:1 / -1}
.idcard .f small{display:block;font-size:clamp(8px,1.8vw,10.5px);letter-spacing:.06em;color:#5A6888;text-transform:uppercase;font-weight:700}
.idcard .f b{display:block;font-size:clamp(11px,2.8vw,16px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idcard .sig{font-family:var(--fq);font-style:italic;font-size:clamp(14px,3.6vw,22px);color:#1D3A80}
.idcard .mrz{position:absolute;left:0;right:0;bottom:0;padding:1.6% 5%;font-family:ui-monospace,Menlo,monospace;font-size:clamp(8px,2vw,12px);letter-spacing:.12em;background:rgba(255,255,255,.55);color:#33415E;white-space:nowrap;overflow:hidden}
.idcard .chip{position:absolute;right:5%;top:30%;width:11%;aspect-ratio:1.3;border-radius:6px;background:linear-gradient(135deg,#F3D58C,#C9962E);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.idcard .seal{position:absolute;right:6%;bottom:16%;width:17%;opacity:.35}

/* Gazete */
.paper{background:#F8F3E6!important;color:#1C2233;border-color:#D8CCAE!important}
.paper .mast{border-bottom:3px double #1C2233;padding-bottom:8px;text-align:center}
.paper .mast span{font-family:Georgia,"Times New Roman",serif;font-size:28px;font-weight:700;display:block}
.paper .mast small{color:#6E6550;font-size:12px}
.paper article{border-bottom:1px solid #E1D6BA;padding:10px 0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.paper article h3{font-family:Georgia,"Times New Roman",serif;font-size:20px;color:#1C2233}
.paper article p{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.paper article small{color:#6E6550;font-size:11.5px}

/* Belediye */
.cityhall{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.cityhall svg{display:block;width:100%;height:auto}
.vote{display:flex;flex-direction:column;gap:6px}
.vote .vb{height:12px;border-radius:7px;background:#1A2A50;overflow:hidden}
.vote .vb i{display:block;height:100%;border-radius:7px}
.kasa{font-family:var(--fc);font-size:36px;font-weight:800;color:var(--gold)}

/* Alt menü + durum çubuğu */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.toast{pointer-events:auto;margin:0 12px;background:rgba(15,28,58,.97);border:1px solid var(--line2);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;font-size:14px}
.toast .dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex:none;box-shadow:0 0 0 3px rgba(61,208,126,.2)}
.toast p{flex:1;margin:0;min-width:0;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.toast p b{color:var(--gold)}
.toast button{border:1px solid var(--line2);background:#14244A;width:34px;height:34px;border-radius:10px;font-size:18px;font-weight:900;flex:none}
.bnav{pointer-events:auto;background:linear-gradient(180deg,#0F1C3A,#081128);border-top:1px solid var(--line2);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 4px 8px}
.bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);padding:6px 0;position:relative;border-radius:10px}
.bnav button svg{width:26px;height:26px}
.bnav button[aria-current="true"]{color:var(--gold);background:linear-gradient(180deg,rgba(233,180,76,.22),transparent);box-shadow:inset 0 2px 0 var(--gold)}
.bnav .badge{top:0;right:18%}
.statusbar{display:none;pointer-events:auto;background:#060C1C;border-top:1px solid var(--line);padding:8px 20px;gap:28px;align-items:center;font-size:13.5px;color:#C9D3E6}
.statusbar .sp{margin-left:auto;font-family:var(--fq);font-style:italic;color:#E8E1CC}
@media (min-width:1080px){ .dock{left:230px} .dock-in{max-width:none} .toast{max-width:560px;margin:0 20px 0 auto} }

/* Başlangıç */
.modal{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px))}
.start{max-width:520px;width:100%;display:flex;flex-direction:column;gap:14px;margin:auto}
.citycard{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:#0C1834;text-align:left;width:100%}
.citycard[aria-pressed="true"],.citycard[aria-current="true"]{border-color:var(--gold);background:rgba(233,180,76,.08)}
.citycard .dot{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#071023;font-weight:900;font-family:var(--fc);font-size:20px;flex:none}
.citycard .t{flex:1;min-width:0}
.citycard .t span{display:block;font-size:13px;color:var(--muted);font-weight:500}
.loading{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted)}
@media (max-width:700px){ .stats .stat:nth-child(n+3){display:none} .topbar{gap:8px} .stat{padding:4px 8px} .stat b{font-size:15.5px} }

/* 0.5 */
.cattabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cattabs::-webkit-scrollbar{display:none}
.cattabs button{flex:none;border:1px solid var(--line2);background:#0F1D3E;border-radius:12px;padding:9px 14px;font-weight:800;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.cattabs button span{font-size:17px}
.cattabs button i{font-style:normal;background:var(--gold);color:#2B1A00;border-radius:9px;min-width:18px;height:18px;font-size:11px;display:inline-grid;place-items:center;padding:0 4px}
.cattabs button[aria-pressed="true"]{background:linear-gradient(180deg,#F2C46A,#C98A1C);color:#2B1A00;border-color:#C98A1C}
.big-buf{display:flex;align-items:baseline;gap:8px}
.big-buf .num{font-family:var(--fc);font-size:34px;font-weight:800;color:var(--gold);line-height:1}
.big-buf small{color:var(--muted);font-weight:600}
.slot.far{opacity:.82}
.slot.shop{padding:0;overflow:hidden;gap:10px}
.slot.shop > *:not(.shopart){margin:0 12px}
.slot.shop > *:last-child{margin-bottom:12px}
.shopart{display:block;width:100%;height:auto;border-bottom:1px solid var(--line)}
.tagline{margin:0;font-family:var(--fq);font-style:italic;font-size:16px;color:#E8E1CC;line-height:1.4}
.flag{font-size:38px;line-height:1;width:48px;text-align:center}
.slot.exp{border-color:var(--goldline)}
.t tr.hl td{background:var(--gold-soft)}
.ranks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ranks div{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:#0C1834}
.ranks b{display:block;font-family:var(--fc);font-size:32px;color:var(--gold);line-height:1.1}
.ranks small{color:var(--muted);font-size:12px}
.card.locked{border-style:dashed}
.bcard{position:relative;border-radius:18px;padding:18px;aspect-ratio:1.586;max-width:420px;width:100%;display:flex;flex-direction:column;justify-content:space-between;color:#fff;
  background:radial-gradient(circle at 85% 15%,rgba(233,180,76,.35),transparent 45%),linear-gradient(135deg,#1C2E66 0%,#0B1530 60%,#2A1E5C 100%);box-shadow:0 14px 30px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.12)}
.bcard .bname{font-family:var(--fc);font-size:20px;letter-spacing:.16em}
.bcard .bchip{width:46px;height:34px;border-radius:7px;background:linear-gradient(135deg,#F3D58C,#C9962E)}
.bcard .bnum{font-family:ui-monospace,Menlo,monospace;font-size:clamp(16px,4.6vw,22px);letter-spacing:.12em}
.bcard small{display:block;font-size:10px;letter-spacing:.12em;color:#C9D3E6}
.bcard b{font-size:15px}
.iban{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px dashed var(--goldline);border-radius:12px;padding:10px 12px;background:#0C1834}
.iban b{font-family:ui-monospace,Menlo,monospace;font-size:15px;letter-spacing:.06em;flex:1;min-width:0;overflow-wrap:anywhere}
.citycard .t span.tag{display:inline-block;width:auto}
.citycard .t .travel,.citycard .t .tv{display:flex}
.travel{display:flex;flex-direction:column;gap:6px;margin-top:8px}

  // ---------- ORTAK DÜNYA: MAKRO ----------

  const infl = S => mac(S.day).infl;

  // ---------- FİYATLAR ----------
  // Excel kuralı: talep yüksekliği +%5..+%25, arz fazlası −%5..−%25

  const ASSETS = [

  // ---------- OYUNCU YARDIMCILARI ----------

  // ---------- SATIŞ TURU (30 dk) ----------
  function salesTick(S, t) {

    // Pazar: şehir tüccarları (botlar) ilanlarından alır
    for (const l of S.list) {
      if (l.adet <= 0) continue;

      const want = Math.floor(demand(S, l.c, l.g) * frac * 0.05 * f * 2 * mod(l.c, 'shop') * noise(S, 0.5, 1.5) + rng(S));
      const q = Math.min(l.adet, want); if (q <= 0) continue;

  }
  const now0 = t => t;

  function dayTick(S, d) {
    const e = eventOn(d); if (e) { const [t, tone] = eventText(e); news(S, t, tone); }

    if (late && d % 4 === 0) news(S, 'Gecikmiş vergi borcun var. Her 6 saatte %0,3 gecikme faizi işliyor.', 'bad');

  }
  function monthly(S, M) {
    for (const f of S.fac) pay(S, FAC[f.t].cost * M.infl * 0.005 * f.lv, 'Fabrika bakımı');
    for (const s of S.st) { const sp = STORE[s.t]; pay(S, sp.rent * M.infl, 'Dükkân kirası'); pay(S, sp.staff * M.wage, 'Personel maaşı'); s.mrev = 0; }
    for (const L of S.bank.loans) { const int = L.rem * L.r, prin = Math.min(L.rem, L.pmt - int); pay(S, int, 'Kredi faizi'); pay(S, prin, 'Kredi anapara'); L.rem -= prin; L.n--; }
    S.bank.loans = S.bank.loans.filter(L => L.n > 0 && L.rem > 1);
    if (S.bank.dep > 0) { const g = S.bank.dep * M.policy * 0.9 / 12; S.bank.dep += g; led(S, 'gelir', 'Mevduat faizi', g); tax(S, S.p.home, g * cfg.rate, 'Mevduat faizi'); }
    if (S.p.cash < 0) { const pen = -S.p.cash * 0.04; pay(S, pen, 'Gecikme cezası'); news(S, `Nakit eksiye düştü. %4 gecikme cezası: ${Math.round(pen).toLocaleString('tr-TR')} ₺.`, 'bad'); }
    S.led.last = S.led.cur; S.led.last.d = S.day; S.led.cur = { gelir: {}, gider: {} };
  }

  // ---------- ANA ADIM ----------
  function step(S, now = Date.now(), maxTicks = 1500) {
    if (S.p.trip && now >= S.p.trip.at) { S.p.loc = S.p.trip.to; news(S, `${CITY[S.p.loc].ye} vardın.`, 'good'); S.p.trip = null; }
    for (const sh of S.ship) if (now >= sh.at) { S.inv[sh.to][sh.g] += sh.n; sh.done = true; news(S, `Sevkiyat ulaştı: ${sh.n.toLocaleString('tr-TR')} ${G[sh.g].ad} ${CITY[sh.to].ad} deposunda.`, 'good'); }
    S.ship = S.ship.filter(s => !s.done);
    if (S.job && now >= S.job.end) { const jb = JOBS.find(j => j.id === S.job.id); if (jb) { earn(S, jb.kazanc, 'İş geliri'); addXp(S, jb.kazanc / 500); S.cnt.jobs = (S.cnt.jobs || 0) + 1; news(S, `${jb.ad} işini bitirdin: ${fmt(jb.kazanc)} kazandın.`, 'good'); } S.job = null; }
    for (const f of S.areas) runArea(S, f, now);
    for (const f of S.fac) runFac(S, f, now);
    let n = 0;
    while (S.tk + TICK_MS <= now) {
      S.tk += TICK_MS;
      const d = globalDay(S.tk);
      while (S.day < d) { S.day++; dayTick(S, S.day); }
      if (n++ < maxTicks) salesTick(S, S.tk);
    }
    while (S.day < globalDay(now)) { S.day++; dayTick(S, S.day); }
    return n;
  }

  // ---------- DEĞER ----------
  const portValue = (S, now) => Object.entries(S.port).reduce((a, [k, h]) => a + h.adet * priceAt(k, slotNow(now)), 0);
  function netWorth(S) {
    let inv = 0, fixed = 0; const M = mac(S.day);
    const val = (c, g, n) => n * ref(S.day, c, g) * 0.9;
    for (const c of CITIES) for (const g of GOODS) if (S.inv[c][g] > 0) inv += val(c, g, S.inv[c][g]);
    for (const sh of S.ship) inv += val(sh.to, sh.g, sh.n);
    for (const l of S.list) inv += val(l.c, l.g, l.adet);
    for (const f of S.areas) { inv += val(f.c, f.prod, f.buf); fixed += AREA[f.kind].price * M.infl * (0.6 + 0.3 * (f.lv - 1)); }
    for (const f of S.fac) { inv += val(f.c, FAC[f.t].r[f.ri].out, f.buf); fixed += FAC[f.t].cost * M.infl * (0.6 + 0.3 * (f.lv - 1)); }
    for (const s of S.st) fixed += STORE[s.t].cost * M.infl * 0.5;
    const borsa = portValue(S), borc = S.bank.loans.reduce((a, L) => a + L.rem, 0);
    const vergi = taxDebt(S);
    return { nakit: S.p.cash, mevduat: S.bank.dep, stok: inv, tesis: fixed, borsa, borc, vergi, net: S.p.cash + S.bank.dep + inv + fixed + borsa - borc - vergi };
  }
  const loanRate = S => (mac(S.day).policy + 0.08) / 12;
  function creditLimit(S) { if (S.p.lv < UNLOCK.kredi) return 0; const nw = netWorth(S); return Math.max(0, 100000 * S.p.lv * infl(S) + 0.35 * Math.max(0, nw.net + nw.borc) - nw.borc); }
  const travelCost = (S, a, b, mode) => (mode === 'ucak' ? (1500 + dist(a, b) * 3) * 1.05 : dist(a, b) * 1.2) * 1.15 * infl(S);
  const travelMs = (a, b, mode) => mode === 'ucak' ? 0 : Math.round(dist(a, b) * 0.1 * 60e3);   // otobüs: 450 km ≈ 45 dk
  const shipMs = (a, b) => Math.round(dist(a, b) * 0.08 * 60e3);                                 // tır: 450 km ≈ 36 dk
  const shipCost = (S, a, b, g, n) => Math.max(500, n * G[g].w * dist(a, b) * 0.0012) * mac(S.day).fuel;

  // ---------- KOMUTLAR ----------
  const ok = (msg, extra) => ({ ok: true, msg, ...extra });
  const no = msg => ({ ok: false, msg });
  const fmt = n => Math.round(n).toLocaleString('tr-TR') + ' ₺';
  const fa = n => Math.floor(n).toLocaleString('tr-TR');
  function canSpend(S, amt) {
    if (S.p.cash < 0) return 'Nakit eksi bakiyede. Önce borcu kapat.';
    if (S.p.cash < amt) return `Nakit yetersiz. Gereken ${fmt(amt)}, mevcut ${fmt(S.p.cash)}.`;
    return null;
  }
  const valid = n => Number.isFinite(n) && n > 0;
  const cleanName = (s, def) => (String(s || '').replace(/[<>]/g, '').trim().slice(0, 32)) || def;
  const pct = r => '%' + Math.round(r * 100);

  const cmd = {
    travel(S, to, mode, now = Date.now()) {
      if (!CITY[to]) return no('Geçersiz şehir.');
      if (S.p.trip) return no('Zaten yoldasın.');
      if (S.p.loc === to) return no(`Zaten ${CITY[to].de}sın.`);
      const cost = travelCost(S, S.p.loc, to, mode), e = canSpend(S, cost); if (e) return no(e);
      pay(S, cost, 'Seyahat');
      const ms = travelMs(S.p.loc, to, mode);
      if (!ms) { S.p.loc = to; return ok(`Uçakla ${CITY[to].ye} geldin (${fmt(cost)}).`); }
      S.p.trip = { from: S.p.loc, to, at: now + ms }; S.p.loc = null;
      return ok(`Otobüs yola çıktı: ${CITY[to].ye} ${Math.round(ms / 60e3)} dakika sonra varırsın.`);
    },
    // Üretim alanları
    buyArea(S, kind, prod, now = Date.now()) {
      const A = AREA[kind]; if (!A) return no('Geçersiz alan.');
      const l = lvl(S, A.lv, A.ad); if (l) return no(l);
      const pr = present(S, S.p.loc); if (pr) return no(pr);
      if (!AREA_PRODS[kind].includes(prod)) prod = AREA_PRODS[kind][0];
      const cost = A.price * infl(S), e = canSpend(S, cost); if (e) return no(e);
      pay(S, cost, 'Yatırım');
      S.areas.push({ id: S.nid++, kind, c: S.p.loc, prod, lv: 1, buf: 0, t0: now, wait: false, note: 'Üretiyor' });
      addXp(S, 30);
      return ok(`${CITY[S.p.loc].de} ${A.ad.toLocaleLowerCase('tr')} satın aldın: ${fmt(cost)}. ${G[prod].ad} üretimi başladı.`);
    },
    setProd(S, id, prod, now = Date.now()) {
      const f = S.areas.find(x => x.id === id); if (!f) return no('Bulunamadı.');
      { const pr = present(S, f.c); if (pr) return no(pr.replace('Bunun için', 'Bu mülkte işlem yapmak için')); }
      if (AREA[f.kind].fixed) return no('Maden sahasının cevheri değiştirilemez.');
      if (!AREA_PRODS[f.kind].includes(prod)) return no('Bu alanda üretilemez.');
      if (f.buf > 0) return no('Önce depodaki ürünü topla.');
      f.prod = prod; f.t0 = now; f.acc = 0;
      return ok(`Üretim ${G[prod].ad} olarak değişti. Ürün saat saat birikir; ${span(G[prod].days)} içinde ${fa(areaBatch(f))} adet.`);
    },
    upgradeArea(S, id) {
      const f = S.areas.find(x => x.id === id); if (!f) return no('Bulunamadı.');
      { const pr = present(S, f.c); if (pr) return no(pr.replace('Bunun için', 'Bu mülkte işlem yapmak için')); }
      if (f.lv >= MAX_LV) return no('En üst seviyede.');
      const cost = areaUpCost(S, f), e = canSpend(S, cost); if (e) return no(e);
      pay(S, cost, 'Yatırım'); f.lv++; addXp(S, 20 * f.lv);
      return ok(`${AREA[f.kind].ad} seviye ${f.lv}: üretim ${fa(areaBatch(f))} adet, depo ${fa(areaCap(f))} adet.`);
    },
    sellArea(S, id) {
      const f = S.areas.find(x => x.id === id); if (!f) return no('Bulunamadı.');
      { const pr = present(S, f.c); if (pr) return no(pr.replace('Bunun için', 'Bu mülkte işlem yapmak için')); }
      if (f.buf > 0) return no('Önce depodaki ürünü topla.');
      const v = AREA[f.kind].price * infl(S) * (0.6 + 0.3 * (f.lv - 1));
      earn(S, v, 'Varlık satışı'); tax(S, f.c, v * cfg.rate, 'Varlık satışı'); S.areas = S.areas.filter(x => x !== f);
      return ok(`${AREA[f.kind].ad} satıldı: ${fmt(v)} (vergi ${fmt(v * cfg.rate)}).`);
    },
    collect(S, kind, id) {
      const f = (kind === 'fac' ? S.fac : S.areas).find(x => x.id === id); if (!f || f.buf < 1) return no('Toplanacak ürün yok.');
      { const pr = present(S, f.c); if (pr) return no(pr.replace('Bunun için', 'Bu mülkte işlem yapmak için')); }
      const g = kind === 'fac' ? FAC[f.t].r[f.ri].out : f.prod, n = Math.floor(f.buf);
      S.inv[f.c][g] += n; f.buf -= n;
      return ok(`${fa(n)} ${G[g].ad} ${CITY[f.c].ad} deposuna taşındı.`);
    },
    collectAll(S) {
      let n = 0;
      let far = 0;
      for (const f of S.areas) if (f.buf >= 1) { if (f.c !== S.p.loc) { far++; continue; } const q = Math.floor(f.buf); S.inv[f.c][f.prod] += q; f.buf -= q; n++; }
      for (const f of S.fac) if (f.buf >= 1) { if (f.c !== S.p.loc) { far++; continue; } const q = Math.floor(f.buf); S.inv[f.c][FAC[f.t].r[f.ri].out] += q; f.buf -= q; n++; }
      const farTxt = far ? ` ${far} yer başka şehirde; oraya gidince toplayabilirsin.` : '';
      return n ? ok(`${n} üretim yerinden ürün ${CITY[S.p.loc].ad} deposuna taşındı.${farTxt}`) : no(far ? `Bulunduğun şehirde toplanacak ürün yok.${farTxt}` : 'Toplanacak ürün yok.');
    },
    // Fabrikalar
    buildFactory(S, t, ri, name, now = Date.now()) {
      const F = FAC[t]; if (!F) return no('Geçersiz fabrika.');
      const l = lvl(S, F.lv, F.ad); if (l) return no(l);
      const pr = present(S, S.p.loc); if (pr) return no(pr);
      const cost = F.cost * infl(S), e = canSpend(S, cost); if (e) return no(e);
      pay(S, cost, 'Yatırım');
      const nm = cleanName(name, `${S.p.name} ${F.ad}`);
      S.fac.push({ id: S.nid++, c: S.p.loc, t, ri: F.r[ri] ? ri : 0, name: nm, lv: 1, on: true, buf: 0, readyAt: now + F.build * DAY_MS, t0: 0, wait: false, note: 'İnşaat' });
      addXp(S, 80);
      return ok(`${nm} inşaatı başladı: ${span(F.build)} sonra üretime geçer.`);
    },
    setRecipe(S, id, ri, now = Date.now()) {
      const f = S.fac.find(x => x.id === id); if (!f || !FAC[f.t].r[ri]) return no('Bulunamadı.');
      { const pr = present(S, f.c); if (pr) return no(pr.replace('Bunun için', 'Bu mülkte işlem yapmak için')); }
      if (f.buf > 0) return no('Önce fabrika deposundaki ürünü topla.');
      f.ri = ri; f.t0 = Math.max(now, f.readyAt); f.acc = 0;
      return ok(`Üretim hattı: ${G[FAC[f.t].r[ri].out].ad}.`);
    },
    toggleFactory(S, id) { const f = S.fac.find(x => x.id === id); if (!f) return no('Bulunamadı.'); { const pr = present(S, f.c); if (pr) return no(pr.replace('Bunun için', 'Bu mülkte işlem yapmak için')); } f.on = !f.on; return ok(f.on ? 'Üretim başladı.' : 'Üretim durduruldu.'); },
    upgradeFactory(S, id) {
      const f = S.fac.find(x => x.id === id); if (!f) return no('Bulunamadı.');
      { const pr = present(S, f.c); if (pr) return no(pr.replace('Bunun için', 'Bu mülkte işlem yapmak için')); }
      if (f.lv >= MAX_LV) return no('En üst seviyede.');
      const cost = facUpCost(S, f), e = canSpend(S, cost); if (e) return no(e);
      pay(S, cost, 'Yatırım'); f.lv++; addXp(S, 40 * f.lv);
      return ok(`${f.name} seviye ${f.lv}: günde ${fa(facCap(f))} adet, depo ${fa(facStore(f))} adet.`);
    },
    // Dükkânlar
    openStore(S, t, name, now = Date.now()) {
      const sp = STORE[t]; if (!sp) return no('Geçersiz dükkân.');
      const l = lvl(S, sp.lv, sp.ad); if (l) return no(l);
      const pr = present(S, S.p.loc); if (pr) return no(pr);
      const cost = sp.cost * infl(S), e = canSpend(S, cost); if (e) return no(e);
      pay(S, cost, 'Yatırım');
      const nm = cleanName(name, `${S.p.name} ${sp.ad}`);
      S.st.push({ id: S.nid++, c: S.p.loc, t, name: nm, r: 1, readyAt: now, mrev: 0, lastRev: 0 });
      addXp(S, 60); return ok(`${nm} ${CITY[S.p.loc].de} açıldı. ${CITY[S.p.loc].ad} deposundaki ürünleri satar.`);
    },
    setPrice(S, id, r) { const s = S.st.find(x => x.id === id); if (!s) return no('Bulunamadı.'); if (present(S, s.c)) return no(`Fiyatı değiştirmek için ${CITY[s.c].de} olman gerekiyor.`); s.r = clamp(r, 0.8, 1.3); return null; },
    closeStore(S, id) { const s = S.st.find(x => x.id === id); if (!s) return no('Bulunamadı.'); { const f = s; const pr = present(S, f.c); if (pr) return no(pr.replace('Bunun için', 'Bu mülkte işlem yapmak için')); } const v = STORE[s.t].cost * infl(S) * 0.5; earn(S, v, 'Varlık satışı'); tax(S, s.c, v * cfg.rate, 'Varlık satışı'); S.st = S.st.filter(x => x !== s); return ok(`${s.name} devredildi: ${fmt(v)}.`); },
    rename(S, kind, id, name) { const x = (kind === 'fac' ? S.fac : S.st).find(o => o.id === id); if (!x) return no('Bulunamadı.'); { const f = x; const pr = present(S, f.c); if (pr) return no(pr.replace('Bunun için', 'Bu mülkte işlem yapmak için')); } const nm = cleanName(name, ''); if (!nm) return no('Bir isim yaz.'); x.name = nm; return ok(`Yeni isim: ${nm}.`); },
    // Lojistik
    ship(S, a, b, g, n, now = Date.now()) {
      const l = lvl(S, UNLOCK.lojistik, 'Lojistik'); if (l) return no(l);
      if (!CITY[b] || a === b || !G[g]) return no('Geçersiz seçim.');
      n = Math.floor(n); if (!valid(n)) return no('Geçerli bir adet gir.');
      if (n > S.inv[a][g]) return no(`Depoda ${fa(S.inv[a][g])} adet var.`);
      const cost = shipCost(S, a, b, g, n), e = canSpend(S, cost); if (e) return no(e);
      pay(S, cost, 'Nakliye'); S.inv[a][g] -= n;
      S.ship.push({ id: S.nid++, from: a, to: b, g, n, at: now + shipMs(a, b) });
      addXp(S, 8); return ok(`Tır yola çıktı: ${Math.round(shipMs(a, b) / 60e3)} dakika sonra ${CITY[b].ad} deposunda. Nakliye ${fmt(cost)}.`);
    },
    // Pazar
    listCreate(S, c, g, n, price, id) {
      if (!G[g] || !CITY[c]) return no('Geçersiz seçim.');
      n = Math.floor(n); if (!valid(n)) return no('Geçerli bir adet gir.');
      if (n > S.inv[c][g]) return no(`${CITY[c].ad} deposunda ${fa(S.inv[c][g])} adet var.`);
      const L = limits(S.day, c, g);
      if (!(price >= L.taban - 1e-9 && price <= L.tavan + 1e-9)) return no(`Fiyat ${fmt(L.taban)} ile ${fmt(L.tavan)} arasında olmalı.`);
      if (S.list.length >= 15) return no('En fazla 15 açık ilanın olabilir.');
      S.inv[c][g] -= n;
      const l = { id, g, c, adet: n, price: Math.round(price * 100) / 100, ts: Date.now(), pend: 0 };
      S.list.push(l); addXp(S, 3);
      return ok(`${fa(n)} adet ${G[g].ad} toptancıda ilana çıktı: adedi ${fmt(l.price)}.`, { l });
    },
    listReturn(S, id, n) {
      const l = S.list.find(x => x.id === id); if (!l) return no('İlan bulunamadı.');
      const back = Math.max(0, Math.min(n ?? l.adet, l.adet));
      S.inv[l.c][l.g] += back; S.list = S.list.filter(x => x !== l);
      return ok(back > 0 ? `İlan kapatıldı, ${fa(back)} adet ${CITY[l.c].ad} deposuna döndü.` : 'İlan kapatıldı.');
    },
    pazarQuote(S, L, n) {
      const goods = n * L.price, here = S.p.loc || (S.p.trip && S.p.trip.to);
      const nak = L.c === here ? 0 : shipCost(S, L.c, here, L.g, n);
      return { goods, nak, total: goods + nak, here, ms: L.c === here ? 0 : shipMs(L.c, here) };
    },
    pazarCheck(S, L, n) {
      n = Math.floor(n); if (!valid(n)) return no('Geçerli bir adet gir.');
      if (n > L.adet) return no(`İlanda ${fa(L.adet)} adet var.`);
      const q = cmd.pazarQuote(S, L, n), e = canSpend(S, q.total); if (e) return no(e);
      return ok('', { q });
    },
    pazarBuy(S, L, n, now = Date.now()) {
      const chk = cmd.pazarCheck(S, L, n); if (!chk.ok) return chk;
      n = Math.floor(n); const q = chk.q;
      pay(S, q.goods, 'Pazar alımları'); if (q.nak) pay(S, q.nak, 'Nakliye');
      if (!q.ms) S.inv[q.here][L.g] += n; else S.ship.push({ id: S.nid++, from: L.c, to: q.here, g: L.g, n, at: now + q.ms });
      addXp(S, 4);
      return ok(`${fa(n)} adet ${G[L.g].ad} alındı: ${fmt(q.total)}${q.ms ? `. ${Math.round(q.ms / 60e3)} dakika sonra ${CITY[q.here].ad} deposunda` : `. ${CITY[q.here].ad} deposunda`}.`);
    },
    // Toptancı (sistem stoku)
    wsQuote(S, g, n, now = Date.now()) { const unit = wsPrice(globalDay(now), g), goods = unit * n, t = goods * WS_TAX; return { unit, goods, tax: t, total: goods + t }; },
    wsCheck(S, g, n, now = Date.now()) {
      if (!G[g]) return no('Geçersiz ürün.');
      n = Math.floor(n); if (!valid(n)) return no('Geçerli bir adet gir.');
      if (S.p.trip || !CITY[S.p.loc]) return no('Yoldasın. Varınca alım yapabilirsin.');
      const q = cmd.wsQuote(S, g, n, now), e = canSpend(S, q.total); if (e) return no(e);
      return ok('', { q });
    },
    wsBuy(S, g, n, now = Date.now()) {
      const chk = cmd.wsCheck(S, g, n, now); if (!chk.ok) return chk;
      n = Math.floor(n); const q = chk.q, c = S.p.loc;
      pay(S, q.goods, 'Toptan alım'); tax(S, c, q.tax, 'Toptan alım vergisi'); S.inv[c][g] += n; addXp(S, 2);
      S.wsLog = S.wsLog || []; S.wsLog.unshift({ ts: now, t: 'al', g, n, v: q.total, who: 'Toptancı' }); if (S.wsLog.length > 80) S.wsLog.length = 80;
      return ok(`${fa(n)} adet ${G[g].ad} toptancıdan alındı: ${fmt(q.total)} (vergi ${fmt(q.tax)}). ${CITY[c].ad} deposunda.`, { q });
    },
    // Ödeme alma (pazar satışı veya havale)
    receive(S, p) {
      if (p.kind === 'havale') { earn(S, p.net, 'Gelen havale'); news(S, `${p.fromName || 'Bir oyuncu'} sana ${fmt(p.net)} gönderdi${p.note ? `: "${String(p.note).slice(0, 80)}"` : ''}.`, 'good'); return; }
      earn(S, p.gross, 'Pazar satışları'); tax(S, p.c || S.p.home, p.gross * cfg.rate, 'Pazar satışı'); addXp(S, p.gross / 400);
      S.wsLog = S.wsLog || []; S.wsLog.unshift({ ts: Date.now(), t: 'sat', g: p.g, n: p.adet, v: p.gross, who: p.fromName || 'Oyuncu' }); if (S.wsLog.length > 80) S.wsLog.length = 80;
      news(S, `${p.fromName || 'Bir oyuncu'} pazardaki ilanından ${fa(p.adet)} adet ${G[p.g] ? G[p.g].ad : ''} aldı: ${fmt(p.gross)} (vergi ${fmt(p.gross * cfg.rate)}).`, 'good');
    },
    sendMoney(S, amount) {
      if (!valid(amount)) return no('Geçerli bir tutar gir.');
      const e = canSpend(S, amount); if (e) return no(e);
      const t = amount * cfg.rate;
      pay(S, amount, 'Giden havale'); tax(S, S.p.loc || S.p.home, t, 'Havale');
      return ok(`${fmt(amount)} gönderildi. ${fmt(t)} havale vergisi hesabından kesildi.`, { net: amount, t });
    },
    payTax(S) {

async function initNet() {

    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    NET.user = user;

  } catch (e) {}
}
async function loadRemoteState() {

}

async function findByIban(iban) {
  const n = ibanNorm(iban); if (n.length < 10) return null;
  const hit = NET.players.find(x => x.iban && ibanNorm(x.iban) === n); if (hit) return hit;
  const c = NET.ibanCache[n]; if (c && Date.now() - c.t < (c.p ? 60000 : 10000)) return c.p;
  if (!NET.db) return null;
  for (const v of [ibanFmt(n), n]) {
    try {
      const s = await NET.db.collection('players').where('iban', '==', v).limit(1).get();
      if (s.docs.length) { const d = s.docs[0], x = { id: d.id, ...d.data() }; NET.ibanCache[n] = { p: x, t: Date.now() }; return x; }
    } catch (e) { if (e && e.code === 'permission-denied') throw e; }
  }
  NET.ibanCache[n] = { p: null, t: Date.now() }; return null;
}

const navCur = nav => nav.querySelector('[aria-current="true"]') || nav.querySelector('[data-v="more"]');
function navSnap() {
  const ind = document.querySelector('.nav-ind'); if (!ind) return null;
  const t = getComputedStyle(ind).transform;
  return { x: t && t !== 'none' ? new DOMMatrixReadOnly(t).m41 : 0, w: parseFloat(getComputedStyle(ind).width) || 0 };
}
function navAnim(prev) {
  const nav = document.querySelector('.bnav'); if (!nav) return;
  const cur = navCur(nav), ind = document.createElement('i'); ind.className = 'nav-ind'; nav.appendChild(ind);
  if (!cur) { ind.style.opacity = 0; return; }
  const x = cur.offsetLeft, w = cur.offsetWidth, key = cur.dataset.v, changed = key !== ui.navKey; ui.navKey = key;
  ind.style.width = (prev ? prev.w : w) + 'px'; ind.style.transform = `translateX(${prev ? prev.x : x}px)`;
  if (prev && (prev.x !== x || prev.w !== w)) {
    void ind.offsetWidth;
    ind.style.transition = 'transform 1.1s cubic-bezier(.22,1,.36,1), width 1.1s cubic-bezier(.22,1,.36,1)';
    ind.style.width = w + 'px'; ind.style.transform = `translateX(${x}px)`;
  } else { ind.style.width = w + 'px'; ind.style.transform = `translateX(${x}px)`; }
  const ic = cur.querySelector('svg'), kf = NAV_ANIM[key];
  if (changed && ic && kf && ic.animate) ic.animate(kf, { duration: 1000, easing: 'cubic-bezier(.22,1,.36,1)' });
}
function navFix() {
  const nav = document.querySelector('.bnav'); if (!nav) return;
  const cur = navCur(nav), ind = nav.querySelector('.nav-ind'); if (!cur || !ind) return;
  ind.style.transition = 'none'; ind.style.width = cur.offsetWidth + 'px'; ind.style.transform = `translateX(${cur.offsetLeft}px)`;
}

function updateLive() {

}

function wsSoldNow(g) {
  const slot = TX.wsSlot();
  if (NET.on) { const d = NET.wsAll[String(slot)]; return d && d.sold ? (d.sold[g] || 0) : 0; }
  return S.wsOff && S.wsOff.slot === slot ? (S.wsOff.sold[g] || 0) : 0;
}
function wsInfo(g) {
  const slot = TX.wsSlot(), st = TX.wsStock(slot)[g], left = Math.max(0, st - wsSoldNow(g)), cap = Math.max(1, Math.ceil(st * TX.WS_CAP));
  const got = S.wsb && S.wsb.slot === slot ? (S.wsb.got[g] || 0) : 0, mine = Math.max(0, cap - got);
  return { st, left, cap, mine, max: Math.min(left, mine), price: TX.wsPrice(TX.globalDay(), g) };
}
async function buyWs(g, n) {
  n = Math.floor(n); if (!(n >= 1)) return { ok: false, msg: 'Geçerli bir adet gir.' };

  if (!S.wsb || S.wsb.slot !== slot) S.wsb = { slot, got: {} };
  const mine = cap - (S.wsb.got[g] || 0), pre = TX.cmd.wsCheck(S, g, n, now); if (!pre.ok) return pre;
  const fail = left => n > left ? { ok: false, msg: left < 1 ? 'Bu ürünün bu turdaki stoku tükendi.' : `Stokta ${left.toLocaleString('tr-TR')} adet kaldı.` } : n > mine ? { ok: false, msg: `Bu turda bu üründen en fazla ${cap.toLocaleString('tr-TR')} adet alabilirsin (kalan hakkın ${Math.max(0, mine).toLocaleString('tr-TR')}).` } : null;
  if (NET.on) {
    const ref = NET.db.doc('wholesale/' + slot);
    try {
      const ls = await ref.acquire({ holder: NET.me, ttlMs: 8000 }); if (!ls.acquired) return { ok: false, msg: 'Toptancıda şu an yoğunluk var. Birkaç saniye sonra tekrar dene.' };
      const snap = await ref.get(), sold = snap.exists ? ((snap.data().sold || {})[g] || 0) : 0, f = fail(st - sold); if (f) return f;
      if (snap.exists) await ref.update({ ['sold.' + g]: sold + n, ts: now }); else await ref.set({ slot: String(slot), sold: { [g]: n }, ts: now });
    } catch (e) { return { ok: false, msg: 'Alım tamamlanamadı, bağlantını kontrol et.' }; }
  } else {
    if (!S.wsOff || S.wsOff.slot !== slot) S.wsOff = { slot, sold: {} };
    const f = fail(st - (S.wsOff.sold[g] || 0)); if (f) return f; S.wsOff.sold[g] = (S.wsOff.sold[g] || 0) + n;

}

const EXTRA_ACTS = new Set(['wcat', 'wclear', 'wstep', 'wset', 'wbuy', 'atab', 'asel', 'ainfo', 'amod', 'agrant', 'amsg', 'aipban', 'aipunban', 'areply', 'adel', 'amsgdel', 'awsreset', 'fbopen']);
async function extraAct(a, d, asyncOp) {
  const adm = () => NET.owner && NET.db;
  if (a.startsWith('a') && a !== 'atab' && a !== 'asel' && !adm()) return { ok: false, msg: 'Bu işlem yalnızca yönetici içindir.' };
  switch (a) {
    case 'wcat': ui.wcat = d.v; ui.psel = null; return null;
    case 'wclear': ui.pfilter = 'all'; return null;
    case 'wstep': { const w = wsInfo(d.g), k = 'wn_' + d.g, cur = Math.floor(dnum(fv(k, Math.max(1, Math.min(w.max, 100))))), st = cur >= 1000 ? 100 : cur >= 100 ? 10 : 1; ui.f[k] = String(Math.max(1, Math.min(Math.max(1, w.max), cur + st * +d.v))); return null; }
    case 'wset': ui.f['wn_' + d.g] = String(Math.max(1, +d.v)); return null;
    case 'wbuy': { const w = wsInfo(d.g), r = await asyncOp(() => buyWs(d.g, Math.floor(dnum(fv('wn_' + d.g, Math.max(1, Math.min(w.max, 100))))))); if (r && r.ok) ui.psel = null; return r; }
    case 'fbopen': fbOpen(); return null;
    case 'atab': ui.atab = d.v; return null;
    case 'asel': ui.asel = ui.asel === d.v ? null : d.v; ui.ainfo = null; return null;
    case 'ainfo': return asyncOp(async () => { const s = await NET.db.doc('users/' + d.id).get(); ui.ainfo = { uid: d.id, ip: s.exists ? (s.data().ip || '') : '' }; return { ok: true, msg: ui.ainfo.ip ? 'IP bilgisi getirildi.' : 'Bu oyuncunun IP kaydı yok (henüz yeni sürümle giriş yapmamış olabilir).' }; });
    case 'amod': { const on = d.on === '1', patch = { [d.k]: on }; if (d.k === 'banned') patch.reason = on ? (prompt('Ban sebebi (oyuncuya gösterilir):', '') || 'Kurallara aykırı davranış') : ''; return asyncOp(() => setMod(d.id, patch)); }
    case 'agrant': {
      const g = { cash: dnum(fv('g_cash', 0)), gems: Math.round(dnum(fv('g_gems', 0))), xp: Math.round(dnum(fv('g_xp', 0))), lv: Math.round(dnum(fv('g_lv', 0))) };
      if (!g.cash && !g.gems && !g.xp && !g.lv) return { ok: false, msg: 'En az bir değer gir.' };
      for (const k of Object.keys(g)) if (!g[k]) delete g[k];
      return asyncOp(async () => { await NET.db.collection('adminMsgs').add({ to: d.id, from: NET.me, fromName: 'Yönetim', text: 'Yönetimden hediye geldi!', grant: g, ts: Date.now(), read: false, done: false }); for (const k of ['g_cash', 'g_gems', 'g_xp', 'g_lv']) delete ui.f[k]; return { ok: true, msg: 'Gönderildi. Oyuncu oyuna girince hesabına işlenir.' }; });
    }
    case 'amsg': { const txt = String(fv('a_msg', '')).trim(); if (!txt) return { ok: false, msg: 'Mesaj yaz.' }; return asyncOp(async () => { await NET.db.collection('adminMsgs').add({ to: d.id, from: NET.me, fromName: 'Yönetim', text: txt.slice(0, 500), ts: Date.now(), read: false }); delete ui.f.a_msg; return { ok: true, msg: 'Mesaj gönderildi.' }; }); }
    case 'aipban': return asyncOp(async () => {
      const s = await NET.db.doc('users/' + d.id).get(), ip = s.exists ? (s.data().ip || '') : '';
      if (!ip) return { ok: false, msg: 'Bu oyuncunun IP kaydı yok.' };
      if (!confirm(ip + ' adresi banlansın mı? Aynı ağı kullanan başkaları da etkilenebilir.')) return null;
      const p = NET.allPlayers.find(x => x.id === d.id);
      await NET.db.doc('ipbans/' + ipKey(ip)).set({ ip, uid: d.id, name: (p && p.name) || '', by: NET.me, ts: Date.now() });
      await setMod(d.id, { banned: true, reason: 'IP banı' }); return { ok: true, msg: 'IP banlandı ve hesap askıya alındı.' };
    });
    case 'aipunban': return asyncOp(() => deleteDoc('ipbans/' + d.id));
    case 'areply': {
      const x = (d.kind === 'reports' ? NET.reports : NET.feedback).find(z => z.id === d.id), txt = String(fv('rp_' + d.id, '')).trim();
      if (!x || !txt) return { ok: false, msg: 'Yanıt yaz.' };
      const to = d.kind === 'reports' ? x.from : x.uid;
      return asyncOp(async () => { await NET.db.doc(d.kind + '/' + d.id).update({ reply: txt, repAt: Date.now(), status: 'answered' }); await NET.db.collection('adminMsgs').add({ to, from: NET.me, fromName: 'Yönetim', text: txt, re: (d.kind === 'reports' ? 'Şikayetin: ' : 'Geri bildirimin: ') + String(x.text).slice(0, 80), ts: Date.now(), read: false }); delete ui.f['rp_' + d.id]; return { ok: true, msg: 'Yanıt gönderildi.' }; });
    }
    case 'adel': return asyncOp(() => deleteDoc(d.kind + '/' + d.id));
    case 'amsgdel': return asyncOp(() => deleteDoc('chat_global/' + d.id));
    case 'awsreset': return asyncOp(() => deleteDoc('wholesale/' + TX.wsSlot()));
  }
  return null;
}

async function act(a, d) {
  if (a === 'home') { startPick(d.v); return; }
  if (a === 'snext') { startNext(); return; }
  if (a === 'sstart') { startGo(); return; }
  if (a === 'sback') { ui.start.step = 1; startBody(); return; }
  if (!S) return;

  $("okT").textContent = `Hoş geldin, ${d.name}!`;
  show("ok");
  window.TXPROF = { uid: u.uid, name: d.name, city: d.city, cityId: CITY_ID[d.city] };
  window.claude = { use: async k => k === "db" ? makeDb() : k === "user" ? makeUser(u.uid) : null };
  setTimeout(() => { host.remove(); window.__txResolve(window.TXPROF); }, 900);
}

/* ===== İsim değiştirme: yeni ismi al, eskisini boşa çıkar ===== */
window.__txRename = async (newName) => {
  if (!auth || !auth.currentUser) throw { message: "Giriş yapılmamış." };
  const u = auth.currentUser, n = newName.trim().replace(/\s+/g, " ");
  if (n.length < 3 || n.length > 16) throw { message: "İsim 3–16 karakter olmalı." };
  if (!/^[A-Za-z0-9_ ığüşöçİĞÜŞÖÇ]+$/.test(n)) throw { message: "Sadece harf, rakam, boşluk ve _ kullan." };
  await runTransaction(db, async tx => {
    const ur = doc(db, "users", u.uid), us = await tx.get(ur);
    const nr = doc(db, "usernames", key(n)), ns = await tx.get(nr);
    const oldName = us.exists() ? us.data().name : null;
    const or = oldName ? doc(db, "usernames", key(oldName)) : null;
    const os = or && or.id !== nr.id ? await tx.get(or) : null;
    if (ns.exists() && ns.data().uid !== u.uid) throw { message: "Bu isim alınmış, başka bir isim dene." };
    if (!ns.exists()) tx.set(nr, { uid: u.uid, name: n });
    if (os && os.exists() && os.data().uid === u.uid) tx.delete(or);
    tx.set(ur, { uid: u.uid, name: n, updatedAt: serverTimestamp() }, { merge: true });
  });
  if (window.TXPROF) window.TXPROF.name = n;
  return n;
};
window.__txSignOut = async () => { try { await signOut(auth); } catch (e) {} };
window.__txProviders = () => (auth && auth.currentUser ? auth.currentUser.providerData.map(p => p.providerId) : []);

/* ===== Hesabı sil: oyuncu verisi + kullanıcı adı(ları) + giriş hesabı ===== */
window.__txDeleteAccount = async (pw) => {
  if (!auth || !auth.currentUser) throw { message: "Giriş yapılmamış." };
  const { A, F } = FB, u = auth.currentUser, uid = u.uid;
  if (window.__txProviders().includes("password")) {
    if (!pw) throw { message: "Şifreni yaz." };
    try { await A.reauthenticateWithCredential(u, A.EmailAuthProvider.credential(u.email, pw)); }
    catch (x) { throw { message: x.code === "auth/invalid-credential" || x.code === "auth/wrong-password" ? "Şifre hatalı." : msg(x) }; }
  } else { await A.reauthenticateWithPopup(u, new A.GoogleAuthProvider()); }
  const del = async ref => { try { await F.deleteDoc(ref); } catch (e) {} };
  /* bu hesaba ait tüm kullanıcı adları */
  try { const q = await F.getDocs(F.query(F.collection(db, "usernames"), F.where("uid", "==", uid))); for (const d of q.docs) await del(d.ref); } catch (e) {}
  /* açık ilanlar */
  try { const q = await F.getDocs(F.query(F.collection(db, "listings"), F.where("seller", "==", uid))); for (const d of q.docs) await del(d.ref); } catch (e) {}
  for (const path of [`data/users/${uid}/state4`, `players/${uid}`, `taxes/${uid}`, `candidates/${uid}`, `votes/${uid}`, `mayors/${uid}`, `papers/${uid}`, `users/${uid}`]) await del(F.doc(db, path));
  await A.deleteUser(u);
};

/* ===== Oyunun beklediği veritabanı arayüzü -> Firestore ===== */
function makeDb() {
  const { F } = FB, clean = d => JSON.parse(JSON.stringify(d));
  const snapD = s => ({ exists: s.exists(), id: s.id, data: () => s.data() });
  const isState = p => /\/state4$/.test(p);
  const dref = p => F.doc(db, p);
  const wrapDoc = path => ({
    id: path.split("/").pop(),
    async get() {
      const s = await F.getDoc(dref(path));
      if (isState(path) && s.exists()) { const d = s.data(); return { exists: true, id: s.id, data: () => ({ ts: d.ts, s: JSON.parse(d.json) }) }; }
      return snapD(s);
    },
    async set(d) { return F.setDoc(dref(path), isState(path) ? { ts: d.ts, json: JSON.stringify(d.s) } : clean(d)); },
    async update(d) { return F.updateDoc(dref(path), clean(d)); },
    async delete() { return F.deleteDoc(dref(path)); },
    onSnapshot(cb, err) { return F.onSnapshot(dref(path), s => cb(snapD(s)), err || (() => {})); },
    async acquire({ holder, ttlMs }) {
      const lr = F.doc(db, "locks", path.replace(/\//g, "__"));
      const acquired = await F.runTransaction(db, async tx => {
        const s = await tx.get(lr), now = Date.now();
        if (s.exists() && s.data().holder !== holder && s.data().exp > now) return false;
        tx.set(lr, { holder, exp: now + ttlMs }); return true;
      });
      return { acquired };
    }
  });
  const wrapCol = path => {
    const c = [];
    const q = {
      orderBy(f, d) { c.push(F.orderBy(f, d || "asc")); return q; },
      limit(n) { c.push(F.limit(n)); return q; },
      where(a, b, v) { c.push(F.where(a, b, v)); return q; },
      onSnapshot(cb, err) { return F.onSnapshot(F.query(F.collection(db, path), ...c), s => cb({ docs: s.docs.map(d => ({ id: d.id, data: () => d.data() })) }), err || (() => {})); },
      async get() { const s = await F.getDocs(F.query(F.collection(db, path), ...c)); return { docs: s.docs.map(d => ({ id: d.id, data: () => d.data() })) }; },
      async add(d) { const r = await F.addDoc(F.collection(db, path), clean(d)); return { id: r.id }; }
    };
    return q;
  };
  return { doc: wrapDoc, collection: wrapCol };
}
function makeUser(uid) {
  return {
    id: async () => uid,
    isOwner: async () => { if (isAdmin(auth.currentUser)) return true; try { return (await FB.F.getDoc(FB.F.doc(db, "admins", uid))).exists(); } catch (e) { return false; } },
    can: async () => true
  };
}
